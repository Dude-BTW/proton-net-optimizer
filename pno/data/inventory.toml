# Empty favorites template.
#
# The real, user-specific inventory is stored outside the repository at:
#   ~/.config/proton-net-optimizer/inventory.toml
#
# Secure Core logical servers are named ENTRY-EXIT#N (for example CH-US#3:
# traffic enters through Switzerland and leaves through the United States).
# The plain two-letter entries are regular countries.

[secure_core]
servers = []
# Exit countries are derived from the server names above.
exits = []

[countries]
known = []
include_all = true
